<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="beerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="foamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle (Apple iOS app icon shape) -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect width="496" height="496" x="8" y="8" rx="107" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Subtle glow backdrop -->
  <circle cx="256" cy="270" r="140" fill="#f59e0b" opacity="0.18" filter="url(#glow)" />

  <!-- Beer Mug Graphic -->
  <g transform="translate(4, -6)">
    <!-- Handle -->
    <path d="M330 200 C395 200, 400 330, 330 330" fill="none" stroke="url(#goldGrad)" stroke-width="32" stroke-linecap="round" />
    <path d="M330 215 C375 215, 375 315, 330 315" fill="none" stroke="#0f172a" stroke-width="12" stroke-linecap="round" />

    <!-- Glass Body -->
    <path d="M175 160 L195 380 C197 398, 210 410, 230 410 L300 410 C320 410, 333 398, 335 380 L355 160 Z" fill="url(#beerGrad)" />
    
    <!-- Vertical glass highlights -->
    <path d="M215 190 L225 375" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.4" />
    <path d="M260 210 L265 375" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.25" />
    <path d="M305 210 L300 375" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.2" />

    <!-- Bubbles -->
    <circle cx="235" cy="330" r="5" fill="#fef08a" opacity="0.7" />
    <circle cx="280" cy="300" r="7" fill="#fef08a" opacity="0.6" />
    <circle cx="250" cy="260" r="4" fill="#fef08a" opacity="0.8" />
    <circle cx="295" cy="240" r="6" fill="#fef08a" opacity="0.7" />
    <circle cx="230" cy="215" r="5" fill="#fef08a" opacity="0.6" />

    <!-- Froth / Foam on top -->
    <ellipse cx="265" cy="155" rx="95" ry="24" fill="url(#foamGrad)" />
    <circle cx="180" cy="148" r="28" fill="url(#foamGrad)" />
    <circle cx="225" cy="138" r="34" fill="url(#foamGrad)" />
    <circle cx="275" cy="132" r="38" fill="url(#foamGrad)" />
    <circle cx="325" cy="140" r="32" fill="url(#foamGrad)" />
    <circle cx="355" cy="152" r="24" fill="url(#foamGrad)" />
    
    <!-- Dripping Foam -->
    <path d="M195 165 C195 185, 208 190, 212 175" fill="url(#foamGrad)" />
    <path d="M250 165 C250 195, 265 198, 270 170" fill="url(#foamGrad)" />

    <!-- Dollar / Counter badge at bottom right -->
    <circle cx="360" cy="370" r="44" fill="#10b981" stroke="#0f172a" stroke-width="8" />
    <text x="360" y="386" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle">$</text>
  </g>
</svg>
