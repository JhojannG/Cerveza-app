<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <title>Control Birras - Cuadre de Caja y Ventas</title>

  <!-- iOS PWA Full Screen & Standalone Mode -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Control Birras">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#090d16">
  
  <!-- Viewport for Mobile First & Safe Area Notch Support -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <!-- Icons & Manifest -->
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" onerror="this.onerror=null;this.href='./apple-touch-icon.png';">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" onerror="this.onerror=null;this.href='./icon-192.png';">
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" onerror="this.onerror=null;this.href='./icon.svg';">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              gold: '#f59e0b',
              goldLight: '#fbbf24',
              dark: '#090d16',
              card: '#111827',
              emerald: '#10b981'
            }
          }
        }
      }
    }
  </script>

  <!-- Custom iOS Stylesheet with Fallback -->
  <link rel="stylesheet" href="./css/app.css" onerror="this.onerror=null;this.href='./app.css';">
</head>
<body class="bg-[#090d16] text-slate-100 min-h-screen flex flex-col font-sans select-none antialiased">

  <!-- Fixed Top Header (Cupertino Glassmorphism + Notch Safe) -->
  <header class="fixed top-0 left-0 right-0 z-40 ios-blur border-b border-slate-800/80 pt-safe">
    <div class="max-w-md mx-auto px-4 h-14 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-amber-600 to-amber-400 flex items-center justify-center text-xl shadow-md border border-amber-300/40 glow-gold">
          🍺
        </div>
        <div>
          <h1 id="header-title" class="font-black text-white text-base tracking-tight leading-none flex items-center gap-1.5">
            Control Birras
          </h1>
          <p class="text-[10px] font-bold text-amber-400/90 tracking-wide mt-0.5">Ecuador • USD $</p>
        </div>
      </div>

      <!-- Cloud Sync Pill -->
      <div id="header-sync">
        <!-- Rendered by app.js -->
      </div>
    </div>
  </header>

  <!-- Main Scrollable App Container -->
  <main class="flex-1 max-w-md w-full mx-auto px-3.5 pt-20 pb-safe">
    <!-- Active Tab Dynamic Content -->
    <div id="tab-content" class="min-h-full">
      <!-- Injected by app.js -->
    </div>
  </main>

  <!-- Fixed Bottom Navigation Tab Bar (iOS Native Style) -->
  <nav id="bottom-tab-bar" class="fixed bottom-0 left-0 right-0 z-40 ios-blur border-t border-slate-800/80 pb-safe-tab">
    <!-- Injected by app.js -->
  </nav>

  <!-- Toast Container -->
  <div id="toast-container" class="pointer-events-none"></div>

  <!-- Modal Container -->
  <div id="modal-container"></div>

  <!-- Cart Drawer Container -->
  <div id="cart-drawer-container"></div>

  <!-- Application Entry Point with Dual Path Resolution -->
  <script type="module">
    import('./js/app.js').catch(() => import('./app.js'));
  </script>
</body>
</html>
